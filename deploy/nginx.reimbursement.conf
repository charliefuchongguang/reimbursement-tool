# 反向代理：把域名流量转发到本地 Node 服务（127.0.0.1:3000）
# 用法：复制到 /etc/nginx/sites-available/reimbursement，改 server_name，再 certbot 申请证书
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;   # ← 改成你的域名

    # 视觉识别会上传 base64 图片，需大于后端 50mb 限制
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# 执行 `sudo certbot --nginx -d your-domain.com` 后，certbot 会自动在此文件补充
# listen 443 ssl 与证书路径，并把 80 重定向到 443。